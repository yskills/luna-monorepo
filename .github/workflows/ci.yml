name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core tests
        working-directory: packages/assistant-core
        run: |
          npm ci
          npm test

      - name: Service tests
        working-directory: apps/assistant-service
        run: |
          npm ci
          npm test

      - name: Web build
        working-directory: apps/personal-luna
        run: |
          npm ci
          npm run build

      - name: No secrets in the frontend bundle
        working-directory: apps/personal-luna
        run: |
          if grep -rE "VITE_[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)" src .env.example; then
            echo "Secrets must never be passed through VITE_ variables." && exit 1
          fi

      - name: Dependency audit (high and above)
        run: |
          for dir in packages/assistant-core apps/assistant-service apps/personal-luna; do
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t luna:ci .

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
